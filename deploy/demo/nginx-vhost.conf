# Example vhost for the public demo of pgCellar (demo.pgcellar.dbfactory.io).
# Put it in /etc/nginx/conf.d/ (the two limit_req_zone lines are at the http
# level there). Adapt the host name and the certificate paths.

# Only the sign-in attempts (POST) are counted for the login limit; an empty key is not limited.
map $request_method $pgc_demo_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $pgc_demo_login_key zone=pgc_demo_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pgc_demo_all:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name demo.pgcellar.dbfactory.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.pgcellar.dbfactory.io;

    ssl_certificate     /etc/letsencrypt/live/demo.pgcellar.dbfactory.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.pgcellar.dbfactory.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers. The application already sets X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy and a Content-Security-Policy; these
    # are the ones only the TLS terminator knows about, and the demo is never
    # to be indexed (the application sends X-Robots-Tag too).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The application believes X-Real-IP, and only when the request comes from a
    # private or loopback address (this proxy): it counts sign-in attempts per
    # visitor with it.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    client_max_body_size 16k;
    client_body_timeout 15s;

    limit_req zone=pgc_demo_all burst=60 nodelay;
    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Sign-in: 10 attempts a minute and per address, as in the application.
    location = /login {
        limit_req zone=pgc_demo_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
