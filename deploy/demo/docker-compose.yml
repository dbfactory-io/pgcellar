# Public demonstration of pgCellar: fictional data, read-only, nothing to keep.
# Same image as the real thing (deploy/Dockerfile), started with --demo.
# Built from this checkout on purpose: the demo shows the code of the checkout,
# not the latest release, and pgcellar-updater does not touch it. To run a
# published release instead, replace the build: section and the image line with
#   image: ghcr.io/dbfactory-io/pgcellar:<version>
#
#   docker compose up -d --build        (from this directory)
#
# The instance listens on 127.0.0.1:8081; put nginx in front of it with
# nginx-vhost.conf. See README.md in this directory.
services:
  pgcellar-demo:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: pgcellar:dev
    container_name: pgcellar-demo
    hostname: pgcellar-demo # shown in the public key comment (pgcellar@pgcellar-demo)
    command: ["serve", "--demo", "--listen", ":8080"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      TZ: Europe/Brussels
      PGCELLAR_BASE_URL: https://demo.pgcellar.dbfactory.io
    # Nothing is written outside memory: the root file system is read-only and
    # the temporary directory is a tmpfs. The two tmpfs on /var/lib/* stop the
    # image's VOLUME declarations from creating anonymous volumes.
    read_only: true
    tmpfs:
      # exec is required: the fake barman, psql... are extracted here and run. A
      # Docker tmpfs is noexec by default, and the real Barman of the image would
      # answer instead (pgCellar refuses to start in that case).
      - /tmp:size=64m,mode=1777,exec
      - /var/lib/barman:size=1m
      - /var/lib/pgcellar:size=1m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 200
    cpus: 1.0
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
