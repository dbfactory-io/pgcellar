# pgcellar.dbfactory.io - site du projet pgCellar (statique, servi par ghost_nginx).
# Ce fichier = HTTP (defi ACME + redirection). Le HTTPS est dans pgcellar.dbfactory.io.ssl.conf,
# separe pour charger ce fichier AVANT que le certificat existe.
# Cert : cert-name "pgcellar.dbfactory.io", un seul nom (www non utilise).

server {
    listen 80;
    listen [::]:80;
    server_name pgcellar.dbfactory.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://pgcellar.dbfactory.io$request_uri;
    }
}
