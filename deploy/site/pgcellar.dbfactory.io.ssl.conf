# pgcellar.dbfactory.io - HTTPS. Voir pgcellar.dbfactory.io.conf pour le HTTP.
# Fichiers statiques montes dans /var/www/pgcellar.dbfactory.io (contenu du dossier site/).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pgcellar.dbfactory.io;

    ssl_certificate     /etc/letsencrypt/live/pgcellar.dbfactory.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgcellar.dbfactory.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_pgcellar_dbfactory_io:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pgcellar.dbfactory.io.access.log;
    error_log  /var/log/nginx/pgcellar.dbfactory.io.error.log warn;

    root /var/www/pgcellar.dbfactory.io;
    index index.html;

    expires 1h;
    add_header Cache-Control "public, max-age=3600";

    location / {
        try_files $uri $uri/ =404;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }
}
