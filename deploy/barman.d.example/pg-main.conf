; /etc/barman.d/pg-main.conf
; Streaming backup (backup_method = postgres): no SSH to the database host needed.
; Needs a "barman" role (pg_basebackup rights) and a "streaming_barman" role
; with the REPLICATION attribute on the PostgreSQL side.

[pg-main]
description = "Main application database"

; Normal connection, used for checks and metadata.
conninfo = host=pg-main.example.com user=barman dbname=postgres port=5432
; Replication connection, used for pg_basebackup and WAL streaming.
streaming_conninfo = host=pg-main.example.com user=streaming_barman dbname=postgres port=5432

backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman
create_slot = auto

; Keep 14 days of recovery, never fewer than 2 backups.
retention_policy = RECOVERY WINDOW OF 14 DAYS
minimum_redundancy = 2

backup_compression = gzip
