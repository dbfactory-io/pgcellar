; /etc/barman.d/pg-legacy.conf
; rsync over SSH (backup_method = rsync), for servers where streaming is not an option.
; Needs passwordless SSH from the barman user to postgres@pg-legacy.example.com,
; and archive_command = 'barman-wal-archive barman pg-legacy %p' on that server.

[pg-legacy]
description = "Legacy reporting database"

conninfo = host=pg-legacy.example.com user=barman dbname=postgres port=5432
ssh_command = ssh postgres@pg-legacy.example.com

backup_method = rsync
reuse_backup = link
archiver = on
streaming_archiver = off

retention_policy = RECOVERY WINDOW OF 7 DAYS
minimum_redundancy = 1
