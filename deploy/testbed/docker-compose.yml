# pgCellar test bed on rasp001. Run from this directory (see README, part B):
#   sudo docker compose up -d
# The image is built beforehand (README B3) and loaded as pgcellar:testbed.
services:
  pgcellar:
    image: pgcellar:testbed
    container_name: pgcellar
    ports:
      # Loopback for the Pi itself, and the Pi's LAN address for the relay on hawking
      # (https://pgcellar.stranix.net, VPN-only). 10.79.0.212 is eth0 of rasp001.
      - "127.0.0.1:8082:8080"
      - "10.79.0.212:8082:8080"
    volumes:
      - /mnt/usbdata/pgcellar/barman:/var/lib/barman
      - /mnt/usbdata/pgcellar/data:/var/lib/pgcellar
      # Restores written by "Restore..." (recoveries.dir): mapped on the Docker host, owned by the barman uid.
      - /mnt/usbdata/pgcellar/recoveries:/var/lib/pgcellar/recoveries
      - ./etc/pgcellar:/etc/pgcellar
      - ./etc/barman.d:/etc/barman.d
      - ./etc/barman.conf:/etc/barman.conf:ro
    env_file: .env
    environment:
      TZ: Europe/Brussels
    # The Pi has 3.7 GiB shared with Home Assistant, Grafana, Plex and others.
    mem_limit: 768m
    restart: unless-stopped
