; /etc/barman.d/nyx.conf - test bed, reached through the pg-vpn relay on hawking.

[nyx]
description = "Nyx (nyx-postgres-1, PostgreSQL 18; needs the 5438 listener)"

conninfo = host=10.8.0.1 port=5438 user=barman dbname=postgres
streaming_conninfo = host=10.8.0.1 port=5438 user=streaming_barman

backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman_nyx
create_slot = auto

; Client tools 18 can talk to every server of the test bed (16, 17, 18).
path_prefix = /usr/lib/postgresql/18/bin
