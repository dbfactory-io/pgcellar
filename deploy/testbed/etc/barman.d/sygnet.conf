; /etc/barman.d/sygnet.conf - test bed, reached through the pg-vpn relay on hawking.

[sygnet]
description = "Sygnet (sygnet_postgres, PostgreSQL 16)"

conninfo = host=10.8.0.1 port=5435 user=barman dbname=postgres
streaming_conninfo = host=10.8.0.1 port=5435 user=streaming_barman

backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman_sygnet
create_slot = auto

; Client tools 18 can talk to every server of the test bed (16, 17, 18).
path_prefix = /usr/lib/postgresql/18/bin
