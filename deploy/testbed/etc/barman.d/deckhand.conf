; /etc/barman.d/deckhand.conf - test bed, reached through the pg-vpn relay on hawking.

[deckhand]
description = "Deckhand (deckhand_postgres, PostgreSQL 16)"

conninfo = host=10.8.0.1 port=5433 user=barman dbname=postgres
streaming_conninfo = host=10.8.0.1 port=5433 user=streaming_barman

backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman_deckhand
create_slot = auto

; Client tools 18 can talk to every server of the test bed (16, 17, 18).
path_prefix = /usr/lib/postgresql/18/bin
