; /etc/barman.conf - global Barman settings for the test bed.
; Per-server settings live in /etc/barman.d/<server>.conf.

[barman]
barman_home = /var/lib/barman
barman_user = barman
log_file = /var/lib/barman/barman.log
log_level = INFO
configuration_files_directory = /etc/barman.d

; Retention: 7 days of recovery, never fewer than one backup.
retention_policy = RECOVERY WINDOW OF 7 DAYS
minimum_redundancy = 1

; Alert (barman check) when the newest backup is older than a day.
last_backup_maximum_age = 1 DAY

; Compression: archived WAL files and base backups (backup_method = postgres).
compression = gzip
backup_compression = gzip
