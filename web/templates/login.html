{{define "content"}}
<section class="login">
  <div class="brand">pg<span>Cellar</span></div>
  <h1>{{t "login.title"}}</h1>
  {{if .Err}}<div class="flash bad" role="alert">{{.Err}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{.Data.Token}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>User <input type="text" name="user" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">{{t "btn.login"}}</button>
  </form>
  <p class="motto">{{t "motto"}}</p>
</section>
{{end}}
