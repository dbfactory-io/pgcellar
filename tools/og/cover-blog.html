<!doctype html>
<!--
  Couverture du billet stranix.net qui annonce pgCellar.
  Rendu (les deux formats, même fichier, tout est proportionnel à la fenêtre) :
    chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1600,840 --screenshot=cover-1600x840.png file://.../cover-blog.html
    chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,675 --screenshot=cover-1200x675.png file://.../cover-blog.html
-->
<html lang="fr"><head><meta charset="utf-8"><title>pgCellar - couverture du billet</title>
<style>
:root{
  /* une unité = 1 px sur 1600x840, réduite d'autant sur un format plus petit */
  --u: min(100vw / 1600, 100vh / 840);
  --bg:#0E0C0B; --bg2:#1C1917; --fg:#F3EEE8; --mut:#A89F96; --wine:#8E1F3F; --rose:#F0839F;
}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{
  background:
    radial-gradient(ellipse at 85% 30%, rgba(142,31,63,.20), transparent 55%),
    linear-gradient(135deg, var(--bg) 0%, var(--bg) 35%, var(--bg2) 100%);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.page{position:relative;width:100%;height:100%;box-sizing:border-box;
  padding:calc(72*var(--u)) calc(84*var(--u));display:flex;flex-direction:column}
.bar{position:absolute;left:0;top:0;bottom:0;width:calc(12*var(--u));background:var(--wine)}

.brand{display:flex;align-items:center;gap:calc(16*var(--u))}
.el{width:calc(64*var(--u));height:calc(64*var(--u));color:var(--rose);flex:none}
.el .s{stroke:var(--bg)}.el .f{fill:var(--bg)}
.word{font-size:calc(48*var(--u));font-weight:800;letter-spacing:-.03em;margin:0}
.word span{color:var(--rose)}

.main{flex:1;display:flex;align-items:center;gap:calc(40*var(--u))}
h1{margin:0;flex:none;width:calc(690*var(--u));
  font-size:calc(82*var(--u));line-height:1.06;font-weight:800;letter-spacing:-.022em}
h1 em{font-style:normal;color:var(--rose)}

.shot{flex:1;min-width:0;display:flex;justify-content:center}
.frame{width:calc(760*var(--u));aspect-ratio:775/468;overflow:hidden;
  border-radius:calc(22*var(--u));border:calc(2*var(--u)) solid #3A3330;
  transform:rotate(-3.5deg) translateX(calc(24*var(--u)));
  box-shadow:0 calc(40*var(--u)) calc(90*var(--u)) rgba(0,0,0,.65),0 0 0 calc(1*var(--u)) rgba(240,131,159,.15);
  background:#1C1917}
/* la capture fait 1493 px ; on garde la section Restore drills (x 360 à 1135, y 172 à 640) */
.frame img{display:block;width:calc(1493 / 775 * 100%);max-width:none;margin-left:calc(-360 / 775 * 100%);margin-top:calc(-172 / 775 * 100%)}

.foot{font:500 calc(38*var(--u))/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--mut);letter-spacing:-.01em}
</style></head><body><div class="page"><div class="bar"></div>
<div class="brand">
<svg class="el" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M48 6c9 0 16 8 16 20 0 11-6 19-15 21L38 38 34 18c3-8 8-12 14-12z"/><path d="M14 63c0-12 9-19 22-19h17c7 0 11 7 11 19z"/><circle cx="35" cy="33" r="16" class="s" stroke-width="2.5"/><path d="M27 42C14 49 6 45 7 31" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M1 3h12c0 8-3 12-6 12S1 11 1 3z"/><path d="M7 14v12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M3 6h8" class="s" stroke-width="1.6" stroke-linecap="round"/><circle cx="32" cy="29" r="2.4" class="f"/><path d="M50 18c5 3 7 9 5 15" fill="none" class="s" stroke-width="2.2" stroke-linecap="round"/></svg>
<p class="word">pg<span>Cellar</span></p>
</div>
<div class="main">
<h1>Construit en une journée.<br>Une vraie base restaurée en <em>7&nbsp;secondes.</em></h1>
<div class="shot"><div class="frame"><img src="drills-dark.png" alt=""></div></div>
</div>
<div class="foot">stranix.net · pgcellar.dbfactory.io</div>
</div></body></html>
