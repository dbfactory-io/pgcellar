version: 2

project_name: pgcellar

before:
  hooks:
    # Verify, never rewrite: the release is built from the tagged tree as it is.
    - go mod verify

builds:
  - id: pgcellar
    main: ./cmd/pgcellar
    binary: pgcellar
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# CHANGELOG.md is written by hand. The release notes are the section of the
# version being released, passed with --release-notes (make release-notes).
changelog:
  disable: true

checksum:
  name_template: checksums.txt

# GitHub Release on dbfactory-io/pgcellar. It is created as a draft: the release
# workflow publishes it only once the multi-arch image is pushed and manifest.json
# is attached, so /releases/latest never points at a half-finished release.
# A tag with a suffix (v0.2.0-rc.1) becomes a pre-release.
release:
  github:
    owner: dbfactory-io
    name: pgcellar
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
