version: 2

project_name: pgcellar

before:
  hooks:
    - go mod tidy

builds:
  - id: pgcellar
    main: ./cmd/pgcellar
    binary: pgcellar
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The repository is private for now: build archives, publish nothing.
release:
  disable: true
